name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - name: Guard the built page against tooling bloat
        run: |
          size=$(wc -c < dist/public/index.html)
          echo "index.html is ${size} bytes"
          test "$size" -lt 10000
          ! grep -q "manus" dist/public/index.html
      - name: Smoke-test the production server
        run: |
          NODE_ENV=production PORT=4199 node dist/index.js &
          sleep 2
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4199/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4199/formula)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4199/formula/)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4199/nope)" = "404"
          curl -s -H "Accept-Encoding: gzip" -D- -o /dev/null http://localhost:4199/ | grep -qi "content-encoding: gzip"
